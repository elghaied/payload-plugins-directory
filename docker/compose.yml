# Maintainer sign-in (phase 4) deploy notes, web service only:
#   - GitHub OAuth App owned by the directory's GitHub account, callback: https://payloaddirectory.dev/auth/github/callback
#     -> GITHUB_OAUTH_CLIENT_ID / GITHUB_OAUTH_CLIENT_SECRET. SESSION_SECRET = `openssl rand -hex 32`
#     (rotating it signs everyone out).
#   - Optional GITHUB_WEB_TOKEN: fine-grained PAT, public repositories read-only, created on a bot account that is in no
#     organisation (raises claim ownership checks from 60 to 5,000 requests/hour).
#   - Cloudflare Cache Rule "Bypass cache" when: URI path starts with /me, /submit, /claim/, /auth/
#     OR the request cookie contains "pd_session". Badges (/badge/*.svg) stay cacheable: the origin sends
#     s-maxage=3600 (1 h), so a hidden or trashed plugin's badge can linger at the CDN for up to 1 h (+1 h stale-while-revalidate).
#   - Cloudflare rate-limit rules for /auth/*, /submit, /claim/*, /me and REST writes (POST/PATCH/DELETE on /api/*).
#     Also rate-limit /badge/* requests that carry a query string (cache-busting reaches the origin).
#   - HSTS: send Strict-Transport-Security with includeSubDomains (Cloudflare SSL/TLS > Edge Certificates, or at the proxy)
#     because the pd_session cookie is Secure and must never travel over plain HTTP.
#
# Production stack for Coolify (pasted into a Docker Compose resource; this file is the source of truth).
#
# `directory.env` labels let `pnpm db:push` verify it is about to overwrite the right environment
# (Coolify container names are UUIDs). Give the separate Postgres resource the same label
# (`directory.env=production`) or a container name containing the whole word "production".
#
# web     serves the site, /admin and /api; runs migrations on start.
# worker  runs the sync jobs every minute (discover, sync-repository, npm-stats, snapshot, revalidate)
#         and asks web to revalidate pages via INTERNAL_WEB_URL. Starts once web is healthy (migrated).
#
# EXACTLY ONE worker must run. Payload's handleSchedules is not locked across processes, so a second
# worker (or jobs.autoRun enabled on the web process) would queue every scheduled job twice.
# Never scale `worker` above 1 and never enable jobs.autoRun in payload.config.ts.
services:
  web:
    image: ghcr.io/elghaied/payload-plugins-directory:latest
    command: ['web']
    labels:
      directory.env: production
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET}
      # Maintainer sign-in (web only; the worker never needs these). Deploy note: create the GitHub OAuth App with
      # callback URL ${SERVER_URL}/auth/github/callback and set SESSION_SECRET to `openssl rand -hex 32`.
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID}
      GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET}
      SESSION_SECRET: ${SESSION_SECRET}
      # Optional (web only): fine-grained PAT, public repositories read-only, for claim ownership checks (60 -> 5,000 requests/hour).
      # NOT the worker's GITHUB_TOKEN, which the web client ignores.
      GITHUB_WEB_TOKEN: ${GITHUB_WEB_TOKEN:-}
      # Read at runtime (Payload serverURL / allowed origins, noindex decision).
      # NEXT_PUBLIC_* values are inlined at build time, so they cannot configure a prebuilt image.
      SERVER_URL: https://payloaddirectory.dev
    volumes:
      - media:/app/media
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/api/health']
      interval: 30s
      timeout: 5s
      retries: 3
      # web runs migrations before it serves; failed checks during this window do not count, so a long
      # migration does not mark web unhealthy (the worker waits for service_healthy).
      start_period: 120s
  worker:
    # Same image, `worker` mode. No published ports and no HTTP healthcheck (it serves nothing).
    image: ghcr.io/elghaied/payload-plugins-directory:latest
    command: ['worker']
    restart: unless-stopped
    # SIGTERM (Coolify redeploy): the worker finishes its current batch (up to 45s) before exiting,
    # so jobs are not left stuck in `processing`.
    stop_grace_period: 60s
    deploy:
      replicas: 1
    labels:
      directory.env: production
    depends_on:
      web:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SERVER_URL: https://payloaddirectory.dev
      # The web service's internal address (revalidate jobs POST /api/revalidate here).
      INTERNAL_WEB_URL: http://web:3000
volumes:
  media:
