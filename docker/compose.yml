# DEPLOY CHECKLIST (single source of truth for first deploy and for every Cloudflare rule; the README only links here).
#
# Application, web service:
#   1. GitHub OAuth App (maintainer sign-in) owned by the directory's GitHub account, callback
#      https://payloaddirectory.dev/auth/github/callback -> GITHUB_OAUTH_CLIENT_ID / GITHUB_OAUTH_CLIENT_SECRET.
#      SESSION_SECRET = `openssl rand -hex 32` (rotating it signs everyone out). The worker never needs these.
#   2. Optional GITHUB_WEB_TOKEN: fine-grained PAT, public repositories read-only, created on a bot account that is in no
#      organisation (raises claim ownership checks from 60 to 5,000 requests/hour). Not the worker's GITHUB_TOKEN.
#   3. REVALIDATE_SECRET must be the SAME value on web and worker (the worker's revalidate job POSTs /api/revalidate on
#      INTERNAL_WEB_URL with it); both services read it from the one environment variable below.
#   4. One shared `media` volume attached read-write to BOTH web and worker (the daily orphan-media sweep runs on the worker).
#   5. On start, web runs `payload migrate` and then `payload reindex-search --if-empty`. Check the web log for
#      `Search reindex complete` (upserted ~ listed plugins + categories + tags). After a bulk data operation (db:push):
#      docker exec <web> sh -c 'cd /app/cli && npx payload reindex-search'
#
# Cloudflare (zone payloaddirectory.dev):
#   6. TLS: send Strict-Transport-Security with includeSubDomains (SSL/TLS > Edge Certificates, or at the proxy), because
#      the pd_session cookie is Secure and must never travel over plain HTTP.
#   7. Cache Rule "Bypass cache" when: URI path starts with /me, /submit, /claim/, /auth/, /search or /api/mcp
#      OR the request cookie contains "pd_session". (/search and POST /api/mcp are dynamic, one URL per query: an edge cache
#      rule must never store them.) Badges (/badge/*.svg) stay cacheable: the origin sends s-maxage=3600 (1 h), so a hidden
#      or trashed plugin's badge can linger at the CDN for up to 1 h (+1 h stale-while-revalidate).
#   8. Rate-limit rules, per IP. Keep the MCP rule separate from the REST-write rule, or MCP is throttled like an admin write:
#      a. Auth and maintainer pages: /auth/*, /submit, /claim/*, /me.
#      b. REST writes: POST/PATCH/DELETE on /api/* EXCLUDING /api/mcp*. Include /api/payload-preferences* (the admin uses it;
#         keep the limit low). The app already refuses maintainer sessions on every /api path except /api/plugins and
#         /api/submissions.
#      c. MCP and search: (http.request.method eq "POST" and starts_with(http.request.uri.path, "/api/mcp"))
#         or starts_with(http.request.uri.path, "/search"). Suggested 30 requests / 10 s per IP (Pro+: 120 / 1 min), action
#         Block for 10 s (Pro+: 1 min). One MCP request is at most one tool call. /search is uncached and hits Postgres.
#      d. /badge/* requests that carry a query string (cache-busting reaches the origin).
#      On the Free plan (few rate-limit rules) combine a-d into one rule whose expression is the OR of the paths above, but
#      keep /api/mcp* out of the REST-write branch of that expression.
#   9. WAF custom rule on /api/mcp*: block when the request body is larger than 16 KB, for example
#      starts_with(http.request.uri.path, "/api/mcp") and http.request.body.size > 16384
#      (the app already refuses > 16 KB with 413 and /api/mcp is excluded from Next's 10 MB proxy body buffering, so this
#      only keeps junk off the origin; use the Content-Length header if your plan does not expose body size).
#  10. Optional: Request Header Transform Rule that removes X-Payload-HTTP-Method-Override on /api/mcp* (Payload would read
#      that body with an unbounded request.json() before any handler runs).
#  11. /api/mcp serves non-browser MCP clients only: no CORS. Do not add Access-Control-Allow-Origin there and never set a
#      global Payload `cors`.
#
# Verify after deploy:
#   - for i in $(seq 1 40); do curl -s -o /dev/null -w '%{http_code}\n' 'https://payloaddirectory.dev/search?q=seo'; done | sort | uniq -c
#     shows some 429 (rule 8c).
#   - curl -s https://payloaddirectory.dev/api/mcp -X POST -H 'content-type: application/json' \
#       -H 'accept: application/json, text/event-stream' -H 'mcp-protocol-version: 2025-06-18' \
#       -d '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}' | jq -r '.result.tools[].name'
#     lists comparePlugins, getPlugin, listCategories, searchPlugins; and `curl -sI 'https://payloaddirectory.dev/search?q=seo'` is 200.
#   - repeat a /search or /api/mcp request and confirm no cf-cache-status HIT.
#
# Production stack for Coolify (pasted into a Docker Compose resource; this file is the source of truth).
#
# `directory.env` labels let `pnpm db:push` verify it is about to overwrite the right environment
# (Coolify container names are UUIDs). Give the separate Postgres resource the same label
# (`directory.env=production`) or a container name containing the whole word "production".
#
# web     serves the site, /admin and /api; runs migrations on start.
# worker  runs the sync jobs every minute (discover, sync-repository, npm-stats, snapshot, revalidate)
#         and asks web to revalidate pages via INTERNAL_WEB_URL. Starts once web is healthy (migrated).
#
# EXACTLY ONE worker must run. Payload's handleSchedules is not locked across processes, so a second
# worker (or jobs.autoRun enabled on the web process) would queue every scheduled job twice.
# Never scale `worker` above 1 and never enable jobs.autoRun in payload.config.ts.
services:
  web:
    image: ghcr.io/elghaied/payload-plugins-directory:latest
    command: ['web']
    labels:
      directory.env: production
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET}
      # Maintainer sign-in (web only; the worker never needs these). Deploy note: create the GitHub OAuth App with
      # callback URL ${SERVER_URL}/auth/github/callback and set SESSION_SECRET to `openssl rand -hex 32`.
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID}
      GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET}
      SESSION_SECRET: ${SESSION_SECRET}
      # Optional (web only): fine-grained PAT, public repositories read-only, for claim ownership checks (60 -> 5,000 requests/hour).
      # NOT the worker's GITHUB_TOKEN, which the web client ignores.
      GITHUB_WEB_TOKEN: ${GITHUB_WEB_TOKEN:-}
      # Read at runtime (Payload serverURL / allowed origins, noindex decision).
      # NEXT_PUBLIC_* values are inlined at build time, so they cannot configure a prebuilt image.
      SERVER_URL: https://payloaddirectory.dev
    volumes:
      - media:/app/media
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/api/health']
      interval: 30s
      timeout: 5s
      retries: 3
      # web runs migrations before it serves; failed checks during this window do not count, so a long
      # migration does not mark web unhealthy (the worker waits for service_healthy).
      start_period: 120s
  worker:
    # Same image, `worker` mode. No published ports and no HTTP healthcheck (it serves nothing).
    image: ghcr.io/elghaied/payload-plugins-directory:latest
    command: ['worker']
    restart: unless-stopped
    # SIGTERM (Coolify redeploy): the worker finishes its current batch (up to 45s) before exiting,
    # so jobs are not left stuck in `processing`.
    stop_grace_period: 60s
    deploy:
      replicas: 1
    labels:
      directory.env: production
    depends_on:
      web:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SERVER_URL: https://payloaddirectory.dev
      # The web service's internal address (revalidate jobs POST /api/revalidate here).
      INTERNAL_WEB_URL: http://web:3000
    # The daily orphan-media sweep runs here and unlinks files under /app/media: this MUST be the same volume as web,
    # read-write, or the rows are deleted but the files stay on disk. In Coolify, attach the one shared volume to BOTH
    # services (a per-service volume with the same name is a different volume).
    volumes:
      - media:/app/media
volumes:
  media:
