# Staging stack for Coolify (pasted into a Docker Compose resource; this file is the source of truth).
#
# `directory.env` labels let `pnpm db:push` verify it is about to overwrite the right environment
# (Coolify container names are UUIDs). The Postgres database is a separate Coolify resource: give it
# the same label, `directory.env=staging` (e.g. `--label directory.env=staging` in the resource's custom
# Docker options, if Coolify offers them for databases), or a container name containing "staging".
# db:push refuses to run when neither is true.
#
# Data refresh (stopgap until sync jobs exist): add a Coolify Scheduled Task on the `web` service:
#   command:   /entrypoint.sh refresh
#   frequency: 0 6,18 * * *
#   env:       GITHUB_TOKEN (required; add it to the web service environment)
# It runs scripts/fetch-plugins.ts then `payload seed` inside the running container.
services:
  web:
    image: ghcr.io/elghaied/payload-plugins-directory:staging
    command: ['web']
    labels:
      directory.env: staging
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET}
      # Read at runtime (Payload serverURL / allowed origins, noindex decision).
      # NEXT_PUBLIC_* values are inlined at build time, so they cannot configure a prebuilt image.
      SERVER_URL: https://next.payloaddirectory.dev
    volumes:
      - media:/app/media
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/api/health']
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  media:
